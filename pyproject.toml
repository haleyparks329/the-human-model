[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-model-lift"
version = "1.0.0"
description = "Next-session lift predictions that learn from one athlete's outcomes"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
human_model_lift = ["exercise_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
