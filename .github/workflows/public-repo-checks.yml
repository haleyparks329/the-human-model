name: Public Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile toy example
        run: python -m compileall -q examples
      - name: Run toy example tests
        run: python -m unittest discover -s examples/tests
      - name: Smoke-run toy example
        run: python examples/toy_evidence_review.py
      - name: Validate local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check whitespace
        run: git diff --check
